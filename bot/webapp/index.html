<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Видео-Кружок</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            color: var(--tg-theme-text-color, #333);
        }

        .file-upload-wrapper {
            position: relative;
            margin-bottom: 25px;
            width: 100%;
            max-width: 300px;
        }

        /* Hide the actual file input */
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }

        /* Custom designed button */
        .custom-file-upload {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0088cc;
            /* Blue */
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 136, 204, 0.2);
            position: relative;
            z-index: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .custom-file-upload:active {
            transform: scale(0.98);
        }

        #submitBtn {
            background-color: #4cd964;
            /* Green */
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(76, 217, 100, 0.2);
            transition: all 0.2s ease;
            display: none;
            /* Hidden until file is selected */
        }

        #submitBtn:active {
            transform: scale(0.98);
        }

        #submitBtn:disabled {
            background-color: #a5a5a5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .error-msg {
            color: #ff3b30;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        /* Custom background selection styles */
        .bg-options-wrapper {
            margin-top: 15px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 300px;
            text-align: left;
        }

        .bg-options-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--tg-theme-hint-color, #777);
        }

        .bg-option {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .bg-option input[type="radio"] {
            margin-right: 10px;
            accent-color: #0088cc;
            width: 18px;
            height: 18px;
        }

        .bg-option label {
            font-size: 15px;
            cursor: pointer;
            color: var(--tg-theme-text-color, #333);
        }
    </style>
</head>

<body>

    <h1>Выбери видео (до 150 МБ)</h1>

    <div class="file-upload-wrapper">
        <input type="file" id="videoInput" accept="video/*">
        <div class="custom-file-upload" id="fileNameDisplay">
            📁 Выбрать файл
        </div>
    </div>

    <div class="bg-options-wrapper" id="bgOptionsWrapper" style="display: none;">
        <div class="bg-options-title">Цвет фона кружка:</div>
        <div class="bg-option">
            <input type="radio" id="bgStandard" name="bg_type" value="standard" checked>
            <label for="bgStandard">Стандартный (без фона)</label>
        </div>
        <div class="bg-option">
            <input type="radio" id="bgWhite" name="bg_type" value="white">
            <label for="bgWhite">С белым фоном</label>
        </div>
        <div class="bg-option">
            <input type="radio" id="bgBlack" name="bg_type" value="black">
            <label for="bgBlack">С черным фоном</label>
        </div>
    </div>

    <button id="submitBtn">ОТПРАВИТЬ ВИДЕО</button>
    <div class="error-msg" id="errorMsg"></div>

    <script>
        // Init Telegram WebApp
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const videoInput = document.getElementById('videoInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const bgOptionsWrapper = document.getElementById('bgOptionsWrapper');

        // Handle file selection
        videoInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                // Check format
                if (!file.type.startsWith('video/')) {
                    errorMsg.textContent = 'Пожалуйста, выберите видео файл.';
                    errorMsg.style.display = 'block';
                    submitBtn.style.display = 'none';
                    bgOptionsWrapper.style.display = 'none';
                    fileNameDisplay.textContent = '📁 Выбрать файл';
                    videoInput.value = '';
                    return;
                }

                // Check max size (150MB = 150 * 1024 * 1024 bytes)
                if (file.size > 150 * 1024 * 1024) {
                    errorMsg.textContent = 'Файл слишком большой. Максимум 150 МБ.';
                    errorMsg.style.display = 'block';
                    submitBtn.style.display = 'none';
                    bgOptionsWrapper.style.display = 'none';
                    videoInput.value = '';
                    fileNameDisplay.textContent = '📁 Выбрать файл';
                    return;
                }

                errorMsg.style.display = 'none';
                fileNameDisplay.textContent = file.name;
                submitBtn.style.display = 'block';
                bgOptionsWrapper.style.display = 'block';
            } else {
                fileNameDisplay.textContent = '📁 Выбрать файл';
                submitBtn.style.display = 'none';
                bgOptionsWrapper.style.display = 'none';
            }
        });

        // Handle submission
        submitBtn.addEventListener('click', async function () {
            const file = videoInput.files[0];
            if (!file) return;

            // Get Telegram User ID
            const initDataUnsafe = window.Telegram.WebApp.initDataUnsafe;
            let userId = initDataUnsafe.user ? initDataUnsafe.user.id : null;

            // Fallback: check query parameters
            if (!userId) {
                const urlParams = new URLSearchParams(window.location.search);
                userId = urlParams.get('user_id');
            }

            if (!userId) {
                errorMsg.textContent = 'Ошибка: Не удалось определить ID пользователя Telegram.';
                errorMsg.style.display = 'block';
                return;
            }

            // Get selected background
            const bgTypeOptions = document.getElementsByName('bg_type');
            let selectedBg = 'standard';
            for (const option of bgTypeOptions) {
                if (option.checked) {
                    selectedBg = option.value;
                    break;
                }
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'ЗАГРУЗКА...';

            const formData = new FormData();
            formData.append('video', file);
            formData.append('user_id', userId);
            formData.append('bg_type', selectedBg);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.status === 'ok') {
                        // Close WebApp on success
                        window.Telegram.WebApp.close();
                    } else {
                        throw new Error(result.message || 'Ошибка сервера');
                    }
                } else {
                    throw new Error('Ошибка сети: ' + response.statusText);
                }
            } catch (error) {
                console.error('Upload error:', error);
                errorMsg.textContent = 'Произошла ошибка при загрузке. Попробуйте снова.';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'ОТПРАВИТЬ ВИДЕО';
            }
        });
    </script>
</body>

</html>
